<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Modern Healthcare Gradients -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="needleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="needleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Background Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <rect x="7" y="7" width="106" height="106" rx="25" fill="#f0fdfa" />

  <!-- 360-Degree Continuous Care Orbit Ring -->
  <path d="M 60 14 A 46 46 0 1 1 18 72" 
        stroke="url(#orbitGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-dasharray="190 20" />
  <circle cx="60" cy="14" r="4" fill="#0284c7" />

  <!-- Medical Cross Base -->
  <g filter="url(#needleGlow)">
    <!-- Vertical Cross Beam -->
    <rect x="47" y="24" width="26" height="72" rx="11" fill="url(#crossGrad)" />
    <!-- Horizontal Cross Beam -->
    <rect x="24" y="47" width="72" height="26" rx="11" fill="url(#crossGrad)" />
  </g>

  <!-- ===================================================================== -->
  <!-- CENTER ICONIC CLINICAL NEEDLE & SYRINGE ASSEMBLY                      -->
  <!-- ===================================================================== -->
  <g id="centerNeedleAssembly">
    <!-- Glistening Medicine Micro-Droplet at Needle Tip -->
    <circle cx="60" cy="17" r="2.5" fill="#38bdf8" />
    <circle cx="59.2" cy="16.2" r="0.8" fill="#ffffff" />

    <!-- Precision Stainless Steel Needle Cannula -->
    <path d="M 59 19.5 L 61 17.5 L 61 44 L 59 44 Z" fill="url(#needleMetal)" />

    <!-- Needle Bevel Highlight -->
    <line x1="59.5" y1="20" x2="60.5" y2="44" stroke="#ffffff" stroke-width="0.75" />

    <!-- Luer-Lock Needle Hub (Base Connector) -->
    <path d="M 56 44 L 64 44 L 63 50 L 57 50 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" stroke-linejoin="round" />
    <rect x="58" y="49" width="4" height="2" fill="#0d9488" />

    <!-- Glass Syringe Barrel in Center -->
    <rect x="53" y="51" width="14" height="34" rx="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.6" />

    <!-- Medical Solution / Liquid Column inside Barrel -->
    <rect x="55" y="60" width="10" height="23" rx="1.5" fill="url(#liquidGrad)" opacity="0.85" />

    <!-- Syringe Volumetric Dosage Calibration Marks -->
    <line x1="53" y1="56" x2="57" y2="56" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" />
    <line x1="53" y1="61" x2="56" y2="61" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="53" y1="66" x2="57" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="53" y1="71" x2="56" y2="71" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
    <line x1="53" y1="76" x2="57" y2="76" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- Syringe Finger Flange Base -->
    <path d="M 50 85 L 70 85 L 68 88 L 52 88 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" stroke-linejoin="round" />

    <!-- Plunger Shaft & Push Flange -->
    <rect x="58.5" y="88" width="3" height="10" fill="url(#needleMetal)" />
    <rect x="54" y="97" width="12" height="3" rx="1.5" fill="#0284c7" />

    <!-- Center Radiance / Sparkle Accent -->
    <path d="M 68 36 L 70 38 L 72 36 L 70 34 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
