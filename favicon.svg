<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="favNeedleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="favOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Clean Background Squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <rect x="7" y="7" width="106" height="106" rx="25" fill="#f0fdfa" />

  <!-- 360-Degree Continuous Care Orbit Ring -->
  <path d="M 60 14 A 46 46 0 1 1 18 72" 
        stroke="url(#favOrbitGrad)" 
        stroke-width="5" 
        stroke-linecap="round" />
  <circle cx="60" cy="14" r="4.5" fill="#0284c7" />

  <!-- Medical Cross Base -->
  <rect x="47" y="24" width="26" height="72" rx="11" fill="url(#favCrossGrad)" />
  <rect x="24" y="47" width="72" height="26" rx="11" fill="url(#favCrossGrad)" />

  <!-- CENTER ICONIC CLINICAL NEEDLE & SYRINGE ASSEMBLY -->
  <!-- Medicine Micro-Droplet at Needle Tip -->
  <circle cx="60" cy="17" r="3" fill="#38bdf8" />

  <!-- Precision Needle Cannula -->
  <path d="M 58.8 19.5 L 61.2 17.5 L 61.2 44 L 58.8 44 Z" fill="url(#favNeedleMetal)" />

  <!-- Needle Hub -->
  <path d="M 56 44 L 64 44 L 63 50 L 57 50 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />

  <!-- Glass Syringe Barrel -->
  <rect x="53" y="51" width="14" height="34" rx="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <rect x="55" y="60" width="10" height="23" rx="1.5" fill="#38bdf8" opacity="0.9" />

  <!-- Syringe Finger Flange & Plunger -->
  <path d="M 50 85 L 70 85 L 68 88 L 52 88 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <rect x="58.5" y="88" width="3" height="10" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
  <rect x="54" y="97" width="12" height="3.5" rx="1.5" fill="#0284c7" />
</svg>
