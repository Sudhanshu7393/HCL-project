<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="fullOrbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="fullNeedleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Group: Icon Mark (x: 4, y: 4, size: 40) -->
  <g transform="translate(4, 4)">
    <!-- Soft Squircle Background -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.2" />
    
    <!-- 360 Degree Orbit Arc -->
    <path d="M 20 5 A 15 15 0 1 1 6 24" 
          stroke="url(#fullOrbitGrad)" 
          stroke-width="2.2" 
          stroke-linecap="round" />
    <circle cx="20" cy="5" r="1.8" fill="#0284c7" />

    <!-- Medical Cross -->
    <rect x="16" y="9" width="8" height="22" rx="3.5" fill="url(#fullTealGrad)" />
    <rect x="9" y="16" width="22" height="8" rx="3.5" fill="url(#fullTealGrad)" />

    <!-- Clinical Needle & Syringe in Center -->
    <circle cx="20" cy="7" r="1.2" fill="#38bdf8" />
    <!-- Needle Tip -->
    <line x1="20" y1="8" x2="20" y2="15" stroke="url(#fullNeedleMetal)" stroke-width="1" stroke-linecap="round" />
    <!-- Syringe Hub -->
    <rect x="18.5" y="15" width="3" height="2" rx="0.5" fill="#ffffff" />
    <!-- Syringe Body -->
    <rect x="18" y="17" width="4" height="10" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="0.8" />
    <rect x="18.8" y="20" width="2.4" height="6" fill="#38bdf8" />
    <!-- Finger Flange & Plunger -->
    <line x1="17" y1="27" x2="23" y2="27" stroke="#0f172a" stroke-width="0.8" />
    <rect x="19.2" y="27" width="1.6" height="3" fill="#ffffff" />
    <rect x="18.5" y="30" width="3" height="1" rx="0.5" fill="#0284c7" />
  </g>

  <!-- Group: Brand Typography -->
  <g transform="translate(54, 14)">
    <!-- CareConnect360 Title -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0f172a" letter-spacing="-0.4">
      CareConnect<tspan fill="#0d9488">360</tspan>
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="27" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#059669" letter-spacing="1">
      TELEMEDICINE &bull; 24/7 VIRTUAL OPD
    </text>
  </g>
</svg>
